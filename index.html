<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学級会ナビ</title>
<style>
:root{--ink:#1b2433;--bg:#f5f6fa;--line:#c5cedb;--sub:#475569;--c:#1d4ed8;--rc:#1d4ed8;--rbg:#eef3fd;--go:#1d4ed8}
*{box-sizing:border-box}
html{font-size:18px;-webkit-text-size-adjust:100%}
html.b-lo{font-size:21px}
html.b-mid{font-size:19px}
html.b-hi{font-size:17px}
html.teacher{font-size:18px}
html.tv{font-size:24px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","BIZ UDGothic","Yu Gothic UI","Meiryo","Noto Sans JP",sans-serif;line-height:1.6;overflow-x:hidden;overflow-wrap:anywhere}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p,ol,ul{margin:0}
rt{font-size:.55em;font-weight:normal}
a{color:#1d4ed8}
svg.ic{width:1.3em;height:1.3em;flex:0 0 auto;vertical-align:-.25em}
#app{max-width:1366px;margin:0 auto}
#app.wide{max-width:none}
.nw{white-space:nowrap}
/* ---- 上の帯（学年とステップ・メニュー） ---- */
.top{display:flex;align-items:center;gap:.5rem;padding:.35rem 1rem;background:#fff;border-bottom:1px solid var(--line);position:relative}
.top h1{font-size:1.05rem;color:var(--sub);white-space:nowrap}
.top .lv{font-weight:bold;font-size:1rem;padding:.1rem .7rem;border-radius:999px;background:#1b2433;color:#fff;white-space:nowrap}
.top .sp{flex:1}
.clk{font-size:1.1rem;font-weight:bold;font-variant-numeric:tabular-nums;color:var(--sub);min-width:3.6em;text-align:center}
.menubtn{min-height:44px;min-width:44px;display:inline-flex;align-items:center;gap:.3rem;padding:.1rem .7rem;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:.9rem;font-weight:bold;color:var(--sub)}
.menu{position:absolute;right:.6rem;top:100%;z-index:40;background:#fff;border:2px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:.4rem;display:flex;flex-direction:column;gap:.3rem;min-width:14rem}
.menu button,.menu a{min-height:44px;display:flex;align-items:center;gap:.4rem;padding:.2rem .7rem;border:0;border-radius:8px;background:#f3f5f9;font-size:.95rem;font-weight:bold;color:var(--ink);text-decoration:none;text-align:left}
.agenda{padding:.3rem 1rem;font-size:.95rem;background:#fff;border-bottom:1px solid var(--line);color:var(--sub)}
.agenda b{color:var(--ink)}
.agenda small{display:block;font-size:.9rem}
.note{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.3rem 1rem;font-size:.95rem;background:#334155;color:#fff}
.note span{flex:1 1 14rem}
.nclose{min-height:44px;padding:.1rem .9rem;border:2px solid #fff;border-radius:10px;background:transparent;color:#fff;font-weight:bold}
/* ---- 役割タブ（色＋マーク＋文字） ---- */
#tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.4rem;padding:.6rem 1rem 0}
#tabs button{--tc:#4b5563;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;border:3px solid var(--tc);border-radius:14px;background:#fff;color:var(--ink);font-weight:bold;font-size:1rem;padding:.2rem .2rem;line-height:1.2}
#tabs button svg.ic{width:1.6em;height:1.6em;color:var(--tc)}
#tabs button.on{background:var(--tc);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2)}
#tabs button.on svg.ic{color:#fff}
#tabs button{white-space:nowrap}
@media (min-width:701px) and (max-width:1000px){#tabs{grid-template-columns:repeat(3,minmax(0,1fr))}}
html.b-lo #tabs button{min-height:80px;font-size:1.02rem}
html.b-lo #tabs button svg.ic{width:2em;height:2em}
html.b-hi #tabs button{min-height:52px;flex-direction:row;gap:.35rem;border-width:2px;font-size:.98rem}
html.b-hi #tabs button svg.ic{width:1.3em;height:1.3em}
/* ---- いまの段階（道のり） ---- */
#road{margin:.6rem 1rem 0;padding:.5rem .7rem;background:#fff;border:2px solid var(--line);border-radius:14px}
.rline{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,2.4fr) auto minmax(0,1fr);gap:.4rem;align-items:center}
.rprev,.rnext{font-size:.9rem;color:var(--sub);line-height:1.35}
.rprev{text-align:right;opacity:.75}
.rprev small,.rnext small{display:block;font-size:.78rem}
.rnext{font-weight:bold}
.rarr{color:#94a3b8;font-size:1.2rem}
.rnow{border:4px solid var(--rc);border-radius:14px;padding:.35rem .7rem;background:var(--rbg);text-align:center}
.rnow .nm{font-size:1.45rem;font-weight:bold;line-height:1.3}
.rnow small{display:block;font-size:.85rem;color:var(--sub)}
.rnow .nsub{font-size:.95rem;font-weight:bold;color:var(--sub)}
.rdots{display:flex;flex-wrap:wrap;justify-content:center;gap:.25rem;margin-top:.25rem}
.rdots span{font-size:.82rem;padding:0 .5rem;border-radius:999px;border:2px solid #94a3b8;color:var(--sub);background:#fff}
.rdots span.on{border-color:var(--ink);background:var(--ink);color:#fff;font-weight:bold}
.rdots span.done{text-decoration:line-through;opacity:.7}
.rall{margin-top:.4rem;text-align:center}
.rall button{min-height:44px;padding:.1rem .9rem;border:2px dashed #94a3b8;border-radius:999px;background:#fff;color:var(--sub);font-weight:bold;font-size:.9rem}
#band,#sub{display:none}
#road.open #band{display:flex;flex-direction:column;gap:.25rem;margin-top:.5rem}
#road.open #sub{display:flex;flex-wrap:wrap;gap:.3rem;margin:.3rem 0 .2rem 1.2rem}
#band button{min-height:44px;text-align:left;border:2px solid var(--line);border-radius:10px;background:#fff;padding:.1rem .7rem;font-size:.95rem}
#band button.now{border:3px solid var(--rc);background:var(--rbg);font-weight:bold}
#band button.past{color:#64748b;background:#f1f5f9}
#sub .pg{display:flex;flex-wrap:wrap;gap:.25rem;align-items:center}
#sub .pg b{font-size:.9rem;margin-right:.2rem}
#sub button{min-height:44px;border:2px solid var(--line);border-radius:999px;background:#fff;padding:.05rem .7rem;font-size:.9rem}
#sub button.now{border:3px solid var(--rc);background:var(--rbg);font-weight:bold}
#sub button.past{color:#64748b;background:#f1f5f9}
html.b-lo .rnow .nm{font-size:1.6rem}
html.b-lo #band button,html.b-lo #sub button,html.b-lo .flow li,html.b-lo .bignow,html.b-lo .rnow .nm{word-break:keep-all;overflow-wrap:normal}
html.b-hi .rnow{border-width:3px}
html.b-hi .rnow .nm{font-size:1.3rem}
/* ---- 中身 ---- */
main{padding:.7rem 1rem 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:.8rem;align-items:start}
.card{background:#fff;border:2px solid var(--line);border-radius:14px;padding:.7rem .9rem;margin-bottom:.8rem}
.grid .card,.grid details.fold{margin-bottom:0}
.grid>div>*+*{margin-top:.8rem}
.card h2{font-size:1.2rem;margin-bottom:.4rem;color:var(--rc)}
.card h3{font-size:1.05rem;margin:.6rem 0 .2rem}
.card.main{border:3px solid var(--rc)}
.rolehead{display:flex;align-items:center;gap:.45rem;font-weight:bold;color:var(--rc);font-size:1.05rem;margin-bottom:.3rem}
.rolehead svg.ic{width:1.5em;height:1.5em}
.rolehead span{color:var(--sub);font-weight:normal;font-size:.92rem}
.stagehead{background:var(--rc);color:#fff;border-radius:12px;padding:.3rem .9rem;margin-bottom:.6rem;font-size:1.3rem;font-weight:bold}
.stagehead small{display:block;font-weight:normal;font-size:1rem}
.stagehead .fill,.tvnow .fill{background:transparent;color:#fff;border-bottom-color:#fff3b0}
.bubble{background:#fff;border:2px solid #94a3b8;border-radius:16px 16px 16px 4px;padding:.45rem .8rem;margin:.4rem 0;font-size:1.15rem;line-height:1.7}
.bubble.me{background:#fff8dc;border-color:#a16207;border-width:3px}
.bubble.other{color:var(--sub);font-size:1rem}
.bubble .r{display:inline-block;padding:0 .45rem;margin-right:.45rem;border-radius:8px;background:var(--sc,#475569);color:#fff;font-weight:bold;font-size:.85rem;line-height:1.6;vertical-align:.1em}
.hint{margin:.3rem 0;padding:.25rem .6rem;background:#f1f5f9;border-left:6px solid var(--rc);border-radius:0 8px 8px 0;font-size:1rem}
.lab{font-weight:bold;font-size:1.05rem;margin:.7rem 0 .2rem}
.lab span{display:inline-block;padding:0 .6rem;border-radius:8px;color:#fff;background:var(--rc);margin-right:.4rem}
ul.tl,ol.tl{padding-left:1.4rem}
ul.tl li,ol.tl li{margin:.2rem 0;font-size:1.08rem}
.ex{font-size:.95rem;color:var(--sub)}
.btn{min-height:52px;padding:.2rem 1rem;border:3px solid #1b2433;border-radius:12px;background:#fff;font-weight:bold;color:var(--ink)}
.btn.pri{background:#15803d;border-color:#166534;color:#fff}
.btn.blue{background:var(--go);border-color:#1e3a8a;color:#fff}
.btn.sm{min-height:48px;font-size:1rem}
.navbtns{display:flex;gap:.6rem;flex-wrap:wrap;margin:.6rem 0}
.navbtns .btn{flex:1 1 9rem;min-height:56px;font-size:1.05rem}
/* 次へ／もどる：いちばん目立つ1組。画面の下にいつも出る */
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:1fr 2.2fr;gap:.6rem;max-width:1366px;margin:0 auto;padding:.5rem 1rem calc(.5rem + env(safe-area-inset-bottom));background:#fff;border-top:2px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.1)}
main.hasnav{padding-bottom:6.5rem}
html.b-lo main.hasnav{padding-bottom:7.5rem}
.navbar button{min-height:64px;border-radius:16px;font-weight:bold;font-size:1.2rem;display:flex;align-items:center;justify-content:center;gap:.4rem}
.navbar .back{border:3px solid #1b2433;background:#fff;color:var(--ink)}
.navbar .go{border:3px solid #1e3a8a;background:var(--go);color:#fff;font-size:1.45rem;box-shadow:0 5px 0 #1e3a8a}
.navbar .go:active{transform:translateY(3px);box-shadow:0 2px 0 #1e3a8a}
.navbar svg.ic{width:1.4em;height:1.4em}
.navbar button{white-space:nowrap;padding:.1rem .5rem}
.rolehead{flex-wrap:wrap}
.rolehead b{white-space:nowrap}
html.b-lo .navbar button{min-height:80px;font-size:1.3rem}
html.b-lo .navbar .go{font-size:1.65rem}
html.b-hi .navbar button{min-height:56px}
html.b-hi .navbar .go{font-size:1.25rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:.4rem 0}
.chip{display:inline-block;padding:.3rem .9rem;border:3px solid var(--rc);border-radius:14px;background:#fff;font-size:1.4rem;font-weight:bold;line-height:1.5}
.chip.me{background:#fff8dc;border-color:#a16207}
.fill{background:#fff3b0;border-bottom:3px solid #a16207;padding:0 .15rem;font-weight:bold}
.blank{color:#854d0e;font-weight:bold;white-space:nowrap}
/* たたむカード */
details{margin:.5rem 0;border:2px solid #7c3aed;border-radius:12px;background:#faf7ff;padding:0 .7rem}
details[open]{padding-bottom:.6rem}
summary{cursor:pointer;min-height:48px;display:flex;align-items:center;gap:.4rem;font-weight:bold;font-size:1.05rem;color:#5b21b6}
details details{border-color:#be185d;background:#fff}
details details>summary{color:#9d174d}
details.fold{background:#fff;border:2px solid var(--line);margin:0 0 .8rem}
details.fold>summary{color:var(--ink);font-size:1.1rem}
details.fold>summary::after{content:"＋";margin-left:auto;color:var(--sub)}
details.fold[open]>summary::after{content:"－"}
details.fold.trouble{border:3px solid #b91c1c;background:#fff8f7}
details.fold.trouble>summary{color:#b91c1c}
details.ref{border-color:#0f766e;background:#f2fbfb}
details.ref>summary{color:#115e59}
.cards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:.5rem}
.tk{border:2px solid var(--line);border-radius:12px;padding:.4rem .7rem;background:#fcfdff}
.tk b{display:block;color:var(--rc);font-size:1.05rem}
.tk ul{padding-left:1.3rem}
.tk li{font-size:1.02rem;margin:.1rem 0}
.trouble .tk{border-color:#e3a19b;background:#fff}
.trouble .tk b{color:#b91c1c}
.goal{margin:1rem 0 .2rem;font-size:.9rem;color:var(--sub)}
.flow{list-style:none;padding:0;margin:.3rem 0}
.flow li{padding:.3rem .7rem;margin:.2rem 0;border-radius:10px;border:2px solid var(--line);font-size:1.05rem;background:#fff}
.flow li.now{border:3px solid var(--rc);background:var(--rbg);font-weight:bold}
.flow li.past{color:#64748b;background:#f1f5f9}
.bignow{font-size:1.8rem;font-weight:bold;line-height:1.35;margin:.2rem 0}
.bignext{font-size:1.2rem;color:var(--sub)}
.say-t{font-size:.95rem;color:var(--sub);font-weight:bold;margin-top:.5rem}
.pos3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.35rem;margin:.3rem 0}
.pos3 .tk{padding:.3rem .4rem}
.pos3 .tk b{font-size:.98rem}
.pos3 .tk p{font-size:.98rem;line-height:1.45}
@media (max-width:700px){.pos3{grid-template-columns:1fr}}
.opts2{display:flex;flex-wrap:wrap;gap:.4rem}
.opts2 button{min-height:52px;padding:.2rem 1rem;border:3px solid #1b2433;border-radius:12px;background:#fff;font-weight:bold}
.opts2 button.on{background:#15803d;border-color:#166534;color:#fff}
/* フォーム */
.fl{font-weight:bold;font-size:1.05rem;margin:.8rem 0 .2rem}
.fl small{font-weight:normal;color:var(--sub);font-size:.92rem}
.tx{width:100%;border:3px solid #64748b;border-radius:10px;padding:.4rem .6rem;background:#fffef5;font-size:1.1rem;min-height:52px}
textarea.tx{min-height:90px;resize:vertical}
.tx.num{width:5em}
.prow{display:grid;grid-template-columns:auto 1fr auto;gap:.4rem;align-items:center;margin:.35rem 0}
.prow .pl{font-weight:bold;white-space:nowrap}
.prow .tx.min{width:4.2em;text-align:center}
.chk{display:flex;flex-direction:column;gap:.4rem;margin:.3rem 0}
.chk button{min-height:56px;text-align:left;border:3px solid #1b2433;border-radius:12px;background:#fff;font-weight:bold;padding:.2rem .8rem;font-size:1.05rem}
.chk button.on{background:#15803d;border-color:#166534;color:#fff}
.ok{color:#166534;font-weight:bold}
.warn{color:#b91c1c;font-weight:bold}
.linkbox{width:100%;font-size:.9rem;border:2px solid #64748b;border-radius:8px;padding:.3rem;background:#f6f8fb}
.msg{min-height:1.4em}
/* 時計 */
.tcard{border:6px solid #15803d;border-radius:18px;background:#dcfce7;padding:.4rem .8rem;text-align:center}
.tcard.warn1{border-color:#a16207;background:#fef08a}
.tcard.over{border-color:#b91c1c;background:#fecaca}
.digits{font-size:clamp(3.2rem,13vw,6.5rem);font-weight:bold;line-height:1.05;font-variant-numeric:tabular-nums}
.tstatus{font-size:1.2rem;font-weight:bold;min-height:1.8rem}
.tbtns{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-top:.3rem}
.tbtns .btn{min-width:7rem;min-height:52px;font-size:1.05rem}
.btn.big{display:inline-flex;align-items:center;gap:.35rem;background:#1b2433;border-color:#1b2433;color:#fff}
.presets{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin:.3rem 0}
.presets button{min-height:48px;padding:.1rem .8rem;border:3px solid #1b2433;border-radius:999px;background:#fff;font-weight:bold}
/* 全画面の時計 */
#fs{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;background:#0f172a;color:#fff;padding:2vmin;text-align:center}
#fs.show{display:flex}
#fs.warn1{background:#facc15;color:#111}
#fs.over{background:#b91c1c;color:#fff}
#fsdig{font-size:min(30vw,52vh);font-weight:bold;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}
#fsst{font-size:min(7vw,7vh);font-weight:bold;min-height:1.2em;margin:.2em 0}
#fs .fsb{display:flex;flex-wrap:wrap;gap:2vmin;justify-content:center;margin-top:1vmin}
#fs .fsb button{min-height:56px;min-width:56px;padding:.2rem 1rem;border:3px solid currentColor;border-radius:14px;background:rgba(255,255,255,.12);color:inherit;font-size:max(18px,2.6vmin);font-weight:bold}
#fs .fsclose{position:absolute;top:2vmin;right:2vmin}
#fs .fsclose button{min-height:56px;min-width:56px;padding:.2rem 1rem;border:3px solid currentColor;border-radius:14px;background:rgba(255,255,255,.12);color:inherit;font-size:max(18px,2.6vmin);font-weight:bold}
/* 黒板（縦書き・右から左） */
.board{background:#1f4d3a;border:8px solid #8a5a14;border-radius:8px;padding:.4em;display:flex;flex-direction:row-reverse;gap:.5em;align-items:stretch;font-size:clamp(9px,2.6vw,15px);overflow:hidden;color:#fff}
.board .sec{display:flex;flex-direction:row-reverse;gap:.3em;padding:.3em;border:1.5px dashed rgba(255,255,255,.5);border-radius:4px;align-items:flex-start}
.board .t{writing-mode:vertical-rl;height:11.5em;padding:.35em .12em;border-radius:2px;background:#fff;color:#1b2433;font-weight:bold;line-height:1.2;overflow:hidden;font-size:1em}
.board .t.y{background:#fff3b0}
.boardsc{overflow-x:auto;-webkit-overflow-scrolling:touch;}
@media (max-width:700px){.boardsc .board{min-width:640px;font-size:13px}}
.boardsc{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media (max-width:700px){.boardsc .board{min-width:640px;font-size:13px}}
.board .tcy{text-combine-upright:all}
.board .t.ph{background:#e2e8f0;height:6.5em}
.board .t.ph.now{background:#facc15}
.board .t .tag{display:inline-block;background:#b91c1c;color:#fff;padding:.15em 0;margin-bottom:.2em}
.board .t.op{background:#fff}
.board .mk-r{color:#c62828}
.board .mk-b{color:#1565c0}
.board .arr{align-self:center;color:#ffe07a;font-size:1.1em}
.boardlg{display:flex;flex-direction:row-reverse;justify-content:space-between;gap:.3rem;font-size:.82rem;color:var(--sub);margin-top:.25rem;flex-wrap:wrap}
.who3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:.5rem}
.who3 .tk b{font-size:1.05rem}
/* 選ぶ画面 */
.choose{max-width:1000px;margin:0 auto;padding:1rem}
.choose h2{font-size:1.35rem;margin:1rem 0 .4rem}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:.6rem}
.opts button{min-height:84px;border:3px solid #1b2433;border-radius:16px;background:#fff;font-weight:bold;font-size:1.25rem;padding:.4rem .6rem;line-height:1.35}
.opts button small{display:block;font-weight:normal;font-size:.95rem;color:var(--sub)}
.opts button.on{background:#1b2433;color:#fff}
.opts button.on small{color:#fff}
.gobtn{margin-top:1.2rem;width:100%;min-height:72px;font-size:1.4rem}
/* 全体画面 */
.pill{display:inline-block;padding:0 .6rem;border-radius:999px;background:#1b2433;color:#fff;font-weight:bold;font-size:.9rem;margin-right:.3rem;white-space:nowrap}
.tvwrap{padding:.6rem 1rem 1rem}
.tvtop{display:flex;flex-wrap:wrap;gap:.4rem 1rem;align-items:center;padding:.4rem 1rem;background:#fff;border-bottom:5px solid #1b2433}
.tvtop h1{font-size:1.3rem;color:#1b2433}
.tvtop .sp{flex:1}
.tvtop .clk{font-size:2.2rem;color:#1b2433}
.tvgrid{display:grid;grid-template-columns:3fr 2fr;gap:1rem;align-items:start}
.tvbox{background:#fff;border:4px solid #1b2433;border-radius:16px;padding:.5rem .9rem;margin-bottom:.8rem}
.tvbox .k{font-size:.9rem;color:var(--sub);font-weight:bold}
.tvbox .v{font-size:1.7rem;font-weight:bold;line-height:1.4}
.tvnow{background:#1d4ed8;color:#fff;border-radius:16px;padding:.5rem 1rem;margin-bottom:.8rem}
.tvnow .k{font-size:1rem}
.tvnow .v{font-size:2.4rem;font-weight:bold;line-height:1.3}
.tvp{border:4px solid #cbd5e1;border-radius:14px;padding:.3rem .8rem;margin:.4rem 0;background:#fff}
.tvp.now{border-color:#a16207;background:#fffbe6;box-shadow:0 0 0 4px #fde68a}
.tvp .t{font-size:1.5rem;font-weight:bold}
.phs{display:flex;flex-direction:row;gap:.4rem;flex-wrap:wrap;margin:.2rem 0}
.phs span{flex:1 1 6em;text-align:center;border:3px solid #1b2433;border-radius:10px;padding:.1rem .3rem;font-weight:bold;font-size:1.05rem;background:#fff}
.phs span.now{background:#facc15;border-color:#854d0e}

 var head='<div class="rolehead">'+IC[r]+'<b>'+role(r)+'</b><span>'+F(DATA.ui.roleDesc[r])+'</span></div>'+(it.talk?'<div class="hint">'+F(DATA.ui.hashira)+'：'+headSub(it)+'</div>':'');
 var full='';
 if(r==='s'){
  full+='<div class="say-t">'+F(DATA.ui.sayAll)+'</div>'+L.map(function(l){return bub(l,l.r==='s'?'me':'other');}).join('');
  (it.tip||[]).forEach(function(t){full+='<div class="hint">'+F(t)+'</div>';});
 }else{
  var gl=L.filter(function(l){return l.r===r||(l.r==='g'&&(r==='f'||r==='k'||r==='n'))||((l.r==='z'||l.r==='m'||l.r==='t')&&r==='m');});
  if(gl.length)full+='<div class="say-t">'+F(DATA.ui.sayMe)+'</div>'+gl.map(function(l){return bub(l,'me');}).join('');
  if(r==='m'&&gl.some(function(l){return l.r==='t';}))full+='<div class="hint">'+role('t')+'：'+fv(prep.teian)+'</div>';
  if(r==='f'&&it.stage.id==='kirari')(it.tip||[]).forEach(function(t){full+='<div class="hint">'+F(t)+'</div>';});
 }
 var dl=doOf(it,r),w=(r==='k')?whoOf(it):null;
 if(w)full+=whoCards(w,false);
 else full+='<div class="lab"><span>'+role(r)+'</span>'+F(DATA.ui.doNow)+'</div>'+lis(dl);
 var cards='';
 if(r==='s'&&it.cards)it.cards.forEach(function(c){cards+='<div class="tk" style="margin:.4rem 0"><b>'+F(c.h)+'</b>'+lis(c.items,'')+'</div>';});
 var labs=T(DATA.koku.pos);
 var kwList=r==='s'?it.kw:(w?w.map(function(x,i){return labs[i]+'：'+T(x[0]);}):[dl[0]]);
 var chips='<div class="chips">'+kwList.map(function(k){return '<span class="chip'+(r==='s'?'':' me')+'">'+F(k)+'</span>';}).join('')+'</div>';
 if(S===1){h=head+full+cards;}
 else if(S===2){
  h=head+'<div class="say-t">'+F(DATA.ui.kwHead)+'</div>'+chips+'<details><summary>'+F(DATA.ui.openFull)+'</summary>'+full+cards+'</details>';
 }else{
  /* 二段：まずキーワード、その中にさらに全部の文 */
  h=head+'<details class="lr"><summary>'+F(DATA.ui.lastResort)+'</summary><div class="say-t">'+F(DATA.ui.kwNest)+'</div>'+chips+
   '<details class="lr2"><summary>'+F(DATA.ui.fullNest)+'</summary>'+full+cards+'</details></details>';
  if(r==='s')h+=flowList();
 }
 return '<div class="card main">'+h+'</div>';
}
function flowList(){

 return '<div class="say-t">'+F(DATA.ui.flowHead)+'</div><ul class="flow">'+stages().map(function(s){

  var t=F(s.n);if(s.talk&&s.id===cur.id){var lab=pl(pos.pil);t+='　'+(lab?lab+'・':'')+F(phName(pos.ph));}

}

/* ---------- 時計（副司会） ---------- */
function trem(){return timer.run?(timer.end-Date.now())/1000:timer.rem;}
function fmt(s){s=Math.max(0,Math.ceil(s));var m=Math.floor(s/60),r=s%60;return m+':'+(r<10?'0':'')+r;}
function tSet(sec){timer={run:false,end:0,rem:sec,base:sec,touched:false};}
function pillarSec(){var it=curItem(),m=parseInt(prep.m[it.talk?CP:0],10);return (m>0?m:10)*60;}
function bigBtn(){return '<button class="btn big" data-act="fsopen">'+IC.big+F(DATA.ui.bigShow)+'</button>';}
function timerCard(){
 var ps=pillarSec()/60;
 return '<div class="card"><h2>'+F(DATA.ui.timer)+'</h2><div class="tcard" id="tcard"><div class="presets"><button data-act="tset" data-v="'+ps*60+'">'+F(DATA.ui.tPillar)+'（'+ps+'分）</button><button data-act="tset" data-v="60">1分</button><button data-act="tset" data-v="180">3分</button><button data-act="tset" data-v="300">5分</button></div>'+
  '<div class="digits" id="tdig">0:00</div><div class="tstatus" id="tst"></div>'+
  '<div class="tbtns"><button class="btn pri" data-act="tgo" id="tgo"></button><button class="btn" data-act="treset">'+F(DATA.ui.tReset)+'</button><button class="btn" data-act="tplus">'+F(DATA.ui.tPlus)+'</button>'+bigBtn()+'</div></div></div>';
}
function tState(){var r=trem();return {r:r,over:timer.touched&&r<=0,warn:timer.touched&&r>0&&r<=60};}
function tStatusText(x){return F(x.over?DATA.ui.tOver:x.warn?DATA.ui.tLeft:timer.run?DATA.ui.tRun:timer.touched?DATA.ui.tStop:DATA.ui.tReady);}
function updClock(){
 var d=new Date(),p=function(x){return (x<10?'0':'')+x;},t=d.getHours()+':'+p(d.getMinutes());
 var cs=document.querySelectorAll('.clk');for(var i=0;i<cs.length;i++)cs[i].textContent=t;
 var x=tState();
 var fs=$('fs');
 if(fs&&fs.classList.contains('show')){
  var fd=$('fsdig');if(fd)fd.textContent=x.over?'0:00':fmt(x.r);
  fs.className='show'+(x.over?' over':(x.warn?' warn1':''));
  var fst=$('fsst');if(fst)fst.innerHTML=x.over?F(DATA.ui.tOver)+'　＋'+fmt(-x.r):tStatusText(x);
  var fg=$('fsgo');if(fg)fg.innerHTML=F(timer.run?DATA.ui.tPause:DATA.ui.tStart);
 }
 var dig=$('tdig');if(!dig)return;
 dig.textContent=fmt(x.r);
 var tc=$('tcard');if(tc)tc.className='tcard'+(x.over?' over':(x.warn?' warn1':''));
 var st=$('tst');if(st)st.innerHTML=tStatusText(x);
 var go=$('tgo');if(go)go.innerHTML=F(timer.run?DATA.ui.tPause:DATA.ui.tStart);
}
/* 全画面の時計：Fullscreen API。使えないときは、画面いっぱいの重ね表示。音は出さない。 */
var wakeLock=null;
function fsOpen(){
 var fs=$('fs');
 if(!fs){fs=document.createElement('div');fs.id='fs';document.body.appendChild(fs);}
 fs.setAttribute('role','dialog');
 fs.innerHTML='<div class="fsclose"><button data-act="fsclose">'+F(DATA.ui.closeNote)+'</button></div><div id="fsdig">0:00</div><div id="fsst"></div>'+
  '<div class="fsb"><button data-act="fsminus">−1分</button><button id="fsgo" data-act="tgo"></button><button data-act="tplus">＋1分</button></div>';
 fs.className='show';
 try{if(fs.requestFullscreen){var pr=fs.requestFullscreen();if(pr&&pr.catch)pr.catch(function(){});}else if(fs.webkitRequestFullscreen)fs.webkitRequestFullscreen();}catch(e){}
 try{if(navigator.wakeLock&&navigator.wakeLock.request)navigator.wakeLock.request('screen').then(function(w){wakeLock=w;}).catch(function(){});}catch(e){}
 updClock();
}
function fsClose(){
 var fs=$('fs');if(fs)fs.className='';
 try{if(document.fullscreenElement&&document.exitFullscreen){var pr=document.exitFullscreen();if(pr&&pr.catch)pr.catch(function(){});}}catch(e){}
 try{if(wakeLock){wakeLock.release();wakeLock=null;}}catch(e){}
}
document.addEventListener('fullscreenchange',function(){if(!document.fullscreenElement){var fs=$('fs');if(fs&&fs.classList.contains('show'))fsClose();}});
document.addEventListener('visibilitychange',function(){var fs=$('fs');if(document.visibilityState==='visible'&&fs&&fs.classList.contains('show')&&!wakeLock){try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(w){wakeLock=w;}).catch(function(){});}catch(e){}}});
window.addEventListener('resize',function(){updClock();});

 h+='<h2>'+F(DATA.ui.chooseBand)+'</h2><div class="opts">'+BANDS.map(function(b){G=b;var t=F(DATA.ui.bandName[b])+'<small>'+F(DATA.ui.bandSub[b])+'</small>';return '<button data-act="cg" data-v="'+b+'" class="'+(g===b?'on':'')+'">'+t+'</button>';}).join('')+'</div>';
 G=g||'lo';
 h+='<h2>'+F(DATA.ui.chooseStep)+'</h2><div class="opts">'+[1,2,3].map(function(n){return '<button data-act="cs" data-v="'+n+'" class="'+(s===n?'on':'')+'">'+F(DATA.ui.stepName[n])+'<small>'+F(DATA.ui.stepSub[n])+'</small></button>';}).join('')+'</div>';
 h+='<button class="btn pri gobtn" data-act="cgo"'+((g&&s)?'':' disabled style="opacity:.5"')+'>'+F(DATA.ui.chooseGo)+'</button><p class="ex" style="margin-top:.5rem">'+F(DATA.ui.chooseHint)+'</p></div>';
 G=keep;return h;
}

/* ---------- 画面：全体（テレビ） ---------- */
function tvRoleLine(it){
 var labs=T(DATA.koku.pos),w=whoOf(it);
 var k=w?w.map(function(x,i){return '<span class="nw">'+F(labs[i])+'：'+F(x[0])+'</span>';}).join('／'):F(doOf(it,'k')[0]||'');
 var rows=[['k',k],['f',F(doOf(it,'f')[0]||'')],['n',F(doOf(it,'n')[0]||'')]];
 return '<div class="tvbox tvrole"><div class="k">'+F(DATA.ui.tvRole)+'</div>'+rows.map(function(r){return '<div class="rr"><span class="pill" style="background:'+RC[r[0]][0]+'">'+role(r[0])+'</span>'+r[1]+'</div>';}).join('')+'</div>';
}
function renderTV(){
 document.documentElement.className='tv';var app=$('app');app.className='wide';
 if(!G)G='lo';if(!S)S=1;
 fixPos();var it=curItem();
 var h='<div class="tvtop"><h1>'+F(DATA.ui.title)+'　'+F(DATA.ui.toTv)+'</h1><div class="sp"></div><span class="clk"></span></div><div class="tvwrap">';
 h+='<div class="tvgrid"><div>';
 h+='<div class="tvbox"><div class="k">'+F(DATA.ui.gidai)+'</div><div class="v">'+fv(prep.gidai)+'</div></div>';
 h+='<div class="tvbox"><div class="k">'+F(DATA.ui.meate)+'</div><div class="v" style="font-size:1.4rem">'+fv(prep.meate)+'</div></div>';
 h+='<div class="tvbox"><div class="k">'+F(DATA.ui.hashira)+'</div>';
 for(var p=0;p<nP();p++){
  var on=S<3&&it.talk&&p===pos.pil,m=String(prep.m[p]||'').trim(),lb=pl(p);
  h+='<div class="tvp'+(on?' now':'')+'"><div class="t">'+(lb?lb+'　':'')+fv(prep.h[p])+(m?'<span class="ex">（'+esc(m)+'分）</span>':'')+'</div>';
  /* ステップ3では段階を出さない（議題・めあて・柱・時計だけ） */
  if(S<3)h+='<div class="phs">'+phList(p).map(function(q){return '<span class="'+(on&&q===pos.ph?'now':'')+'">'+F(phName(q))+'</span>';}).join('')+'</div>';
  h+='</div>';
 }
 h+='</div></div><div>';
 if(S<3){
  h+='<div class="tvnow"><div class="k">'+F(DATA.ui.now)+'</div><div class="v">'+headText(it)+'</div></div>';
  var a=seq(),i=seqIdx(),nx=a[i+1];
  if(nx)h+='<div class="tvbox"><div class="k">'+F(DATA.ui.next)+'</div><div class="v" style="font-size:1.3rem">'+itemAt(nx)+'</div></div>';
  h+=tvRoleLine(curItem());
 }
 if(timer.touched||timer.run)h+='<div class="tvtimer"><div class="tcard" id="tcard"><div class="digits" id="tdig"></div><div class="tstatus" id="tst"></div><div class="tbtns">'+bigBtn()+'</div></div></div>';
 h+='</div></div>';
 if(!lsGet(LIVE))h+='<div class="empty" style="margin-top:.8rem">'+F(DATA.ui.tvWait)+'</div>';
 h+='</div>';
 app.innerHTML=h;updClock();
}

/* ---------- 画面：流れ表（印刷）  k=1 キーワードつき／k=0 見出しだけ ---------- */
function renderPrint(){
 document.documentElement.className='';var app=$('app');app.className='';
 if(!G)G='hi';if(!S)S=3;
 var P=DATA.print,kname=PK?DATA.ui.printKw:DATA.ui.printHead;
 var h='<div class="pr"><div class="pbar noprint"><button class="btn pri" data-act="doprint">'+F(P.doPrint)+'</button>'+
  '<a class="btn'+(PK?' on':'')+'" style="display:inline-flex;align-items:center;text-decoration:none" href="'+printHref(1)+'" data-act="toprint">'+F(DATA.ui.printKw)+'</a>'+
  '<a class="btn'+(PK?'':' on')+'" style="display:inline-flex;align-items:center;text-decoration:none" href="'+printHref(0)+'" data-act="toprint">'+F(DATA.ui.printHead)+'</a>'+
  '<a class="btn" style="display:inline-flex;align-items:center;text-decoration:none" href="#g='+G+'&s='+S+'" data-act="back">'+F(P.back)+'</a><span class="ex">'+F(P.tip)+'</span></div><div class="sheet'+(PK?'':' head')+'">';
 h+='<h1>'+F(P.title)+(String(prep.kai||'').trim()&&G!=='lo'?'（第'+esc(prep.kai)+'回）':'')+'<small class="kind">'+F(PK?DATA.ui.kindKw:DATA.ui.kindHead)+'</small></h1><div class="meta"><b>'+F(DATA.ui.gidai)+'</b><span>'+esc(prep.gidai||'')+'</span><b>'+F(DATA.ui.meate)+'</b><span>'+esc(prep.meate||'')+'</span></div><ol>';
 function kwOf(arr){return PK?'<span>'+arr.map(function(k){return Fp(k);}).join('・')+'</span>':'';}
 stages().forEach(function(s){
  if(s.talk){
   h+='</ol><div class="talk"><b>'+F(s.n)+'</b>';
   for(var p=0;p<nP();p++){CP=p;var m=String(prep.m[p]||'').trim(),lb=pl(p);
    h+='<div style="margin-top:2pt"><b>'+(lb?lb+'　':'')+esc(prep.h[p]||'')+'</b>'+(m?'（'+esc(m)+'分）':'')+'</div>';
    var ql=phList(p);
    if(PK&&p===0)ql.forEach(function(q){var t=q<0?DATA.talkSensei[G]:talkPh()[q];h+='<div class="ph"><span class="bx"></span><b style="min-width:6.5em">'+F(t.n)+'</b>'+kwOf(t.kw)+'</div>';});
    else h+='<div class="ph">'+ql.map(function(q){return '<span class="bx"></span><b>'+F(phName(q))+'</b>';}).join(' → ')+'</div>';
   }
   CP=0;h+='</div><ol>';return;
  }
  h+='<li><span class="bx"></span><b>'+F(s.n)+'</b>'+kwOf(s.kw)+'</li>';
 });
 h+='</ol><div class="help"><b>'+F(P.help)+'</b>'+lis(T(P.helpItems),'')+'</div></div></div>';
 app.innerHTML=h;
}

/* ---------- 画面：先生 ---------- */
function renderTeacher(){
 document.documentElement.className='teacher';var app=$('app');app.className='';
 var g=G||'hi',s=S||1;
 var h='<header><h1>学級会ナビ　先生画面</h1><div class="agenda2">議題：'+fv(prep.gidai)+'<small>この画面は大人向けです。子どもの画面とは別に開いてください。</small></div><div class="hbtns"><span class="clk"></span></div></header><div class="tw">';
 h+='<h2>いまの設定と画面の切りかえ</h2><div class="tctl"><b>学年の段階</b>'+[['lo','低学年'],['mid','中学年'],['hi','高学年']].map(function(x){return '<button data-act="tg" data-v="'+x[0]+'" class="'+(g===x[0]?'on':'')+'">'+x[1]+'</button>';}).join('')+'</div>';
 h+='<div class="tctl"><b>ステップ</b>'+[1,2,3].map(function(n){return '<button data-act="ts" data-v="'+n+'" class="'+(s===n?'on':'')+'">ステップ'+n+'</button>';}).join('')+'</div>';
 function ta(href,t){return '<a class="btn" style="display:inline-flex;align-items:center;text-decoration:none" href="'+href+'" target="_blank" rel="noopener">'+t+'</a>';}
 h+='<div class="tctl">'+ta('#g='+g+'&s='+s,'子どもの画面を開く')+ta('#tv','全体画面を開く')+ta('#print&g='+g+'&s='+s+'&k=1','流れ表（キーワードつき）')+ta('#print&g='+g+'&s='+s+'&k=0','流れ表（見出しだけ）')+'</div>';
 h+='<h2>このナビのねらい</h2><ul>'+TEACHER.aim.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
 h+='<h2>学習指導要領との対応</h2><p class="ex">文言は「小学校学習指導要領（平成29年告示）解説 特別活動編」から、原典どおりに写しています（句読点も原典のまま）。</p>';
 TEACHER.youryou.forEach(function(y){h+='<h3>'+esc(y.h)+'</h3><div class="quote">'+esc(y.q)+'<span class="src">'+esc(y.src)+'</span></div>';});
 h+='<h2>ステップの進め方の目安</h2><p class="ex">時期は目安です。学級のようすで前後してかまいません。</p><div class="tblwrap"><table class="tt"><tr><th>ステップ</th><th>画面に出るもの</th><th>次に進む目安</th><th>先生のかかわり</th></tr>'+TEACHER.steps.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>';}).join('')+'</tr>';}).join('')+'</table></div>';
 h+='<h2>先生のお話の入れどころ</h2><div class="tblwrap"><table class="tt">'+TEACHER.talkPoints.map(function(r){return '<tr><th style="width:12em">'+esc(r[0])+'</th><td>'+esc(r[1])+'</td></tr>';}).join('')+'</table></div>';
 h+='<h2>学年の段階による違い</h2><div class="tblwrap"><table class="tt">'+TEACHER.bandDiff.map(function(r,i){return '<tr>'+r.map(function(c,j){return (i===0||j===0?'<th>':'<td>')+esc(c)+(i===0||j===0?'</th>':'</td>');}).join('')+'</tr>';}).join('')+'</table></div>';
 h+='<h2>使い方</h2><ol>'+TEACHER.howto.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>';
 h+='</div>';
 G=g;app.innerHTML=h;updClock();
}

/* ---------- 操作 ---------- */
document.addEventListener('click',function(e){
 var b=e.target.closest('[data-act]');
 if(menuOpen&&(!b||b.getAttribute('data-act')!=='menu')&&!e.target.closest('#menu')){menuOpen=false;if(!b){renderAll();return;}}
 if(!b||b.disabled)return;
 var a=b.getAttribute('data-act'),v=b.getAttribute('data-v');
 if(a==='menu'){menuOpen=!menuOpen;renderAll();return;}
 if(a==='fsopen'){fsOpen();return;}
 if(a==='fsclose'){fsClose();return;}
 if(a==='fsminus'){if(timer.run)timer.end-=60000;else timer.rem=Math.max(0,timer.rem-60);timer.touched=true;broadcast();updClock();return;}
 if(a==='cg'){tmpG=v;if(!tmpS)tmpS=S;renderAll();return;}
 if(a==='cs'){tmpS=+v;if(!tmpG)tmpG=G;renderAll();return;}
 if(a==='cgo'){var g=tmpG||G,s=tmpS||S;if(!g||!s)return;if(g!==G)pos={id:'start',pil:0,ph:0};G=g;S=s;tmpG=null;tmpS=null;chooser=false;changed();window.scrollTo(0,0);return;}
 if(a==='choose'){menuOpen=false;chooser=true;tmpG=G;tmpS=S;renderAll();return;}
 if(a==='stage'){pos={id:v,pil:0,ph:0};changed();return;}
 if(a==='ph'){pos={id:'talk',pil:+b.getAttribute('data-p'),ph:+b.getAttribute('data-q')};changed();return;}
 if(a==='next'){move(1);return;}
 if(a==='prev'){move(-1);return;}
 if(a==='tab'){TAB=v;save();renderAll();return;}
 if(a==='bandall'){bandAll=!bandAll;renderAll();return;}
 if(a==='closenote'){var nc=noteClosed();nc[S]=true;lsSet(NOTEKEY,JSON.stringify(nc));renderAll();return;}
 if(a==='pt'){var k=b.getAttribute('data-k');prep[k]=!prep[k];changed();return;}
 if(a==='sen'){prep.sen=v==='each'?'each':'once';changed();return;}
 if(a==='lp'){prep.lp=+v===2?2:1;changed();return;}
 if(a==='jo'){var i=+b.getAttribute('data-i');prep.jo[i]=!prep.jo[i];changed();return;}
 if(a==='copy'){doCopy();return;}
 if(a==='clear'){askClear=true;renderAll();return;}
 if(a==='clearno'){askClear=false;renderAll();return;}
 if(a==='clearyes'){askClear=false;prep=defPrep();pos={id:'start',pil:0,ph:0};tSet(600);changed();return;}
 if(a==='tset'){tSet(+v);changed(false);updClock();return;}
 if(a==='tgo'){if(timer.run){timer.rem=trem();timer.run=false;}else{timer.end=Date.now()+timer.rem*1000;timer.run=true;timer.touched=true;}broadcast();updClock();return;}
 if(a==='treset'){tSet(timer.base);broadcast();updClock();return;}
 if(a==='tplus'){if(timer.run)timer.end+=60000;else timer.rem+=60;timer.touched=true;broadcast();updClock();return;}
 if(a==='toprint'){e.preventDefault();location.hash=b.getAttribute('href');return;}
 if(a==='doprint'){window.print();return;}
 if(a==='back'){e.preventDefault();location.hash='#g='+G+'&s='+S;return;}
 if(a==='tg'){G=v;renderAll();return;}
 if(a==='ts'){S=+v;renderAll();return;}
});
function doCopy(){
 var url=shareUrl(''),box=$('linkbox'),msg=$('copymsg');if(box)box.value=url;
 function ok(){if(msg){msg.innerHTML=F(DATA.prep.linkDone);msg.className='msg ok';}}
 function ng(){if(box){box.focus();box.select();}try{if(document.execCommand('copy')){ok();return;}}catch(e){}if(msg){msg.innerHTML=F(DATA.prep.linkFail);msg.className='msg warn';}}
 try{if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(url).then(ok,ng);return;}}catch(e){}
 ng();
}
var inTimer=null;
function z2h(v){return v.replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-65248);});}
document.addEventListener('input',function(e){
 var t=e.target;if(!t.getAttribute)return;
 var f=t.getAttribute('data-f'),hi=t.getAttribute('data-h'),mi=t.getAttribute('data-m');
 if(f==='kai'||f==='fm'){var nv=z2h(t.value).replace(/[^0-9]/g,'').slice(0,f==='kai'?3:2);prep[f]=nv;if(t.value!==nv)t.value=nv;}
 else if(f){prep[f]=t.value.slice(0,f==='riyu'?200:120);}
 else if(hi!=null){prep.h[+hi]=t.value.slice(0,80);}
 else if(mi!=null){var v=z2h(t.value).replace(/[^0-9]/g,'').slice(0,3);prep.m[+mi]=v;if(t.value!==v)t.value=v;
  var tot=0;for(var i=0;i<maxP();i++){var mm=parseInt(prep.m[i],10);if(mm>0)tot+=mm;}var pt=$('ptotal');if(pt)pt.innerHTML=F(DATA.prep.total)+'：'+tot+F(DATA.prep.min);}
 else return;
 save();clearTimeout(inTimer);inTimer=setTimeout(function(){broadcast();var lb=$('linkbox');if(lb)lb.value=shareUrl('');var ag=document.querySelector('.agenda');if(ag)ag.innerHTML=F(DATA.ui.gidai)+'：'+fv(prep.gidai)+'<small>'+F(DATA.ui.meate)+'：'+fv(prep.meate)+'</small>';},250);
});
function typing(){var a=document.activeElement;return a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA');}
function onRemote(o){
 if(!o||o.src===ID)return;
 var oldG=G,oldS=S;apply(o);
 if(VIEW==='main'&&typing()){G=oldG||G;S=oldS||S;updClock();return;}
 renderAll();
}
if(bc)bc.onmessage=function(ev){onRemote(ev.data);};
window.addEventListener('storage',function(e){if(e.key===LIVE&&e.newValue){try{onRemote(JSON.parse(e.newValue));}catch(x){}}});
window.addEventListener('hashchange',function(){boot();});

/* ---------- 起動 ---------- */
function boot(){
 var hp=parseHash();
 VIEW=(hp.v==='tv'||hp.v==='teacher'||hp.v==='print')?hp.v:'main';
 PK=hp.k!=='0';
 load();
 if(VIEW==='tv'){try{var l=JSON.parse(lsGet(LIVE)||'null');if(l)apply(l);}catch(e){}}
 if(BANDS.indexOf(hp.g)>=0)G=hp.g;
 if(hp.s==='1'||hp.s==='2'||hp.s==='3')S=+hp.s;
 if(hp.d){var o=dec(hp.d);if(o){prep=cleanPrep(o);if(VIEW==='main'){save();broadcast();}}}
 if(VIEW==='main'&&G&&S){save();setHash();broadcast();}
 renderAll();
}
setInterval(updClock,500);
boot();
})();
</script>
